<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Askezik">
<meta name="description" content="Трекер аскез: обіцянки собі на 7, 21, 30 днів або назавжди. Ранкова обіцянка, вечірній підсумок, карта днів, картки для сторіс.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Askezik</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ede2;--card:#fbf8f2;--ink:#2b2622;--muted:#8a7f73;--line:#e4dacb;--soft:#ece4d6;--acc:#d9822b;--acc2:#f6e6d2;--ok:#6f8f5e;--bad:#b5523b;--shadow:0 1px 0 rgba(60,40,20,.04),0 10px 30px rgba(80,60,30,.07);--serif:'Lora',Georgia,'Times New Roman',serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0b0b;--card:#171615;--ink:#f4efe6;--muted:#9b948a;--line:#2a2826;--soft:#22201e;--acc:#f0a04b;--acc2:#2b2116;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b0b0b;--card:#171615;--ink:#f4efe6;--muted:#9b948a;--line:#2a2826;--soft:#22201e;--acc:#f0a04b;--acc2:#2b2116;--shadow:none;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;border:0;border-radius:14px;cursor:pointer;color:inherit;background:none}
input,textarea{font:inherit;color:var(--ink)}
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 20px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.appbar .ttl{font-size:30px;font-weight:800;flex:1;letter-spacing:-.025em}
.appbar .back{font-size:26px;width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;line-height:1}
.appbar.over{position:fixed;left:0;right:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.appbar.over .back,.appbar.over .act{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.appbar .act{font-size:20px;width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow)}
main{max-width:540px;margin:0 auto;padding:4px calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
main.full{padding-top:0}
.view{animation:vin .22s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 10px}
.hello{font-size:16px;color:var(--muted);margin:0 4px 14px}

/* ritual cards */
.ritual{display:flex;align-items:center;gap:14px;padding:16px 18px}
.ritual .ri{font-size:32px;line-height:1}
.ritual .rb{flex:1}
.ritual .rb b{display:block;font-size:16px}
.ritual .rb span{font-size:13.5px;color:var(--muted)}
.ritual button.go{background:var(--ink);color:var(--bg);padding:10px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.ritual.done{opacity:.75}
.ritual.morning{background:linear-gradient(135deg,color-mix(in srgb,#f2b64c 22%,var(--card)),var(--card))}
.ritual.evening{background:linear-gradient(135deg,color-mix(in srgb,#6b5bd6 22%,var(--card)),var(--card))}
.motd .mk{font-size:12px;font-weight:800;color:var(--acc);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.motd .q{font-size:17px;line-height:1.45;font-weight:600}

/* ascesis card */
.ac{display:flex;gap:16px;align-items:center;cursor:pointer;padding:18px}
.ring{position:relative;width:68px;height:68px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.ac .bd{flex:1;min-width:0}
.ac .t{font-size:18px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ac .s{font-size:13.5px;color:var(--muted);margin-top:3px}
.ac .big{font-size:26px;font-weight:800;color:var(--c);letter-spacing:-.02em;line-height:1.1}
.ac .big small{font-size:13px;font-weight:600;color:var(--muted)}
.hold{position:relative;flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s,background .2s}
.hold svg{position:absolute;inset:0;transform:rotate(-90deg);pointer-events:none}
.hold svg circle{transition:stroke-dashoffset .12s linear}
.hold.holding{transform:scale(.92)}
.hold.holding svg circle.p{transition:stroke-dashoffset .6s linear;stroke-dashoffset:0!important}
.hold.on{background:var(--c,var(--acc));color:#fff;animation:pop .35s ease}
.hold.fail{background:var(--bad);color:#fff}
.hold.wait{opacity:.35;pointer-events:none}
@keyframes pop{50%{transform:scale(1.12)}}
.ask{margin:0 18px 16px;padding:10px 12px;border-radius:14px;background:var(--soft);font-size:14px;display:flex;align-items:center;gap:8px}
.ask span{flex:1}
.ask button{padding:7px 12px;background:var(--card);font-size:14px;font-weight:600}

.empty{text-align:center;padding:40px 20px}
.empty .e{font-size:68px}
.empty h2{margin:10px 0 6px;font-size:24px}
.empty p{color:var(--muted);margin:0 0 22px;line-height:1.5}
.pri{background:var(--ink);color:var(--bg);padding:16px 20px;font-weight:700;font-size:16px;width:100%}
.sec{background:var(--soft);padding:14px 18px;font-weight:600}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(88px + env(safe-area-inset-bottom));z-index:25;width:60px;height:60px;border-radius:50%;background:var(--acc);color:#fff;font-size:32px;line-height:1;box-shadow:0 10px 26px color-mix(in srgb,var(--acc) 45%,transparent)}

/* create */
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpl button{background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;line-height:1.2;min-height:84px;border-radius:16px}
.tpl button b{font-size:28px;font-weight:400}
.tpl button.on{border-color:var(--acc);background:var(--acc2)}
.fld{display:block;margin-top:18px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:700}
.fld input,.fld textarea{width:100%;padding:14px;border-radius:14px;border:2px solid transparent;background:var(--card);box-shadow:var(--shadow);font-size:16px;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--acc)}
.fld textarea{min-height:76px;resize:vertical}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;padding:9px 14px;font-weight:650;font-size:15px}
.pills button.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.pills input{width:86px;padding:9px 10px;border-radius:14px;border:2px solid transparent;background:var(--card);box-shadow:var(--shadow);font-size:15px;text-align:center}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode button{background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;padding:12px;text-align:left}
.mode button b{display:block;font-size:15px}
.mode button small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block;margin-top:2px}
.mode button.on{border-color:var(--acc);background:var(--acc2)}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.icons button{width:44px;height:44px;font-size:22px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent}
.icons button.on{border-color:var(--acc);background:var(--acc2)}
.colors{display:flex;gap:10px}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}

/* detail */
.hero{position:relative;margin:0 -16px 14px;padding:calc(70px + env(safe-area-inset-top)) 20px 26px;text-align:center;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 85%,#fff 15%),color-mix(in srgb,var(--c) 80%,#000 20%));border-radius:0 0 32px 32px;overflow:hidden}
.hero:before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.08);top:-120px;right:-110px}
.hero .bigring{position:relative;width:200px;height:200px;margin:0 auto}
.hero .bigring svg{transform:rotate(-90deg)}
.hero .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero .ic{font-size:36px}
.hero .n{font-size:46px;font-weight:850;line-height:1.05;letter-spacing:-.03em}
.hero .n small{font-size:20px;opacity:.75;font-weight:650}
.hero .l{font-size:13px;opacity:.85}
.hero h2{margin:16px 0 4px;font-size:25px;letter-spacing:-.02em}
.hero .sub{opacity:.85;font-size:14px}
.hero .badge{display:inline-block;background:rgba(255,255,255,.2);font-weight:700;font-size:13px;padding:6px 12px;border-radius:20px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:14px 6px;text-align:center}
.stats b{display:block;font-size:24px;letter-spacing:-.02em}
.stats small{font-size:11.5px;color:var(--muted)}
.holdbar{position:relative;width:100%;overflow:hidden;border-radius:16px;background:var(--c);color:#fff;font-weight:750;font-size:17px;padding:18px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.holdbar .fill{position:absolute;inset:0;background:rgba(255,255,255,.28);transform:scaleX(0);transform-origin:left;transition:transform .12s}
.holdbar.holding .fill{transform:scaleX(1);transition:transform .6s linear}
.holdbar span{position:relative}
.holdbar.done{background:var(--soft);color:var(--c)}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}
.why{font-size:16px;line-height:1.45;font-style:italic}
.lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.phase{display:flex;gap:12px;align-items:flex-start}
.phase .pi{font-size:30px;line-height:1}
.phase b{display:block;font-size:16px;margin-bottom:2px}
.phase span{font-size:14px;color:var(--muted);line-height:1.45}
.ms{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ms span{font-size:12px;font-weight:650;padding:5px 10px;border-radius:20px;background:var(--soft);color:var(--muted)}
.ms span.got{background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--c)}
/* heatmap */
.hm-wrap{overflow-x:auto;margin:4px -4px 0;padding:4px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--s));grid-auto-columns:var(--s);gap:4px}
.hm div{border-radius:calc(var(--s)*.28);background:var(--soft)}
.hm div.x{background:transparent}
.hm div.ok{background:var(--c)}
.hm div.fail{background:var(--bad)}
.hm div.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.hm div.today{box-shadow:inset 0 0 0 2px var(--ink)}
.hm div.ok.today{box-shadow:inset 0 0 0 2px var(--ink)}
.hm div.past{cursor:pointer}
.hm-days{display:grid;grid-template-rows:repeat(7,var(--s));gap:4px;font-size:9px;color:var(--muted);margin-right:6px}
.hm-days span{display:flex;align-items:center;height:var(--s)}
.hm-row{display:flex;justify-content:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.diary .de{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.diary .de:first-of-type{border-top:0}
.diary .dm{font-size:22px}
.diary .dd{font-size:12px;color:var(--muted)}
.diary .dn{font-size:14.5px;line-height:1.4;margin-top:2px}
.failbtn{background:none;color:var(--bad);font-weight:650;padding:12px;width:100%;margin-top:6px}
.danger{color:var(--bad);font-weight:650;padding:14px;width:100%}
.sharebtn{width:100%;background:var(--card);box-shadow:var(--shadow);padding:15px;font-weight:700;margin-bottom:12px;color:var(--c)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:10.5px;font-weight:650;color:var(--muted)}
.tabbar .ti{font-size:22px;filter:grayscale(1);opacity:.5;transition:.15s}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .ti{filter:none;opacity:1}

/* sheet / modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fin .15s ease}
.ov.center{align-items:center;padding:24px}
@keyframes fin{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:540px;max-height:92vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));animation:sup .25s ease}
@keyframes sup{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{margin:0 0 6px;font-size:21px;letter-spacing:-.01em}
.sheet p{color:var(--muted);margin:0 0 16px;line-height:1.45;font-size:15px}
.sheet .col{display:flex;flex-direction:column;gap:8px}
.ev-it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev-it .ei{font-size:24px}
.ev-it .et{flex:1;font-weight:650;font-size:15px}
.yn{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.yn button{padding:8px 12px;font-weight:700;font-size:14px;border-radius:10px;color:var(--muted)}
.yn button.on.y{background:var(--ok);color:#fff}
.yn button.on.n{background:var(--bad);color:#fff}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moods button{background:var(--soft);padding:12px 4px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600}
.moods button b{font-size:28px;font-weight:400}
.moods button.on{border-color:var(--acc);background:var(--acc2)}
.mbox{background:var(--card);border-radius:28px;padding:30px 22px 22px;max-width:350px;width:100%;text-align:center;animation:mpop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes mpop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.mbox .mi{font-size:78px;line-height:1}
.mbox .mk{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-top:12px}
.mbox .mt{font-size:25px;font-weight:850;margin:6px 0;letter-spacing:-.02em}
.mbox .md{color:var(--muted);font-size:15px;line-height:1.45;margin-bottom:20px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:61;overflow:hidden}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{width:max-content;position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-size:14px;font-weight:650;z-index:70;max-width:90vw;text-align:center;animation:fin .2s ease;display:flex;gap:14px;align-items:center}
.toast button{color:var(--acc);font-weight:800;padding:0}
.seg3{display:flex;background:var(--soft);border-radius:14px;padding:3px;margin-top:12px}
.seg3 button{flex:1;padding:11px 4px;font-weight:650;border-radius:11px;color:var(--muted);font-size:14px}
.seg3 button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
.storyimg{width:100%;border-radius:18px;display:block;box-shadow:var(--shadow)}

/* ===== zen redesign ===== */
body{background-image:radial-gradient(color-mix(in srgb,var(--ink) 4%,transparent) .6px,transparent .6px);background-size:7px 7px}
.appbar .ttl,.ac .t,.hero h2,.mbox .mt,.motd .q,.empty h2,.sheet h3,.zh{font-family:var(--serif);letter-spacing:-.01em}
.appbar .ttl{font-weight:700;font-size:32px}
.card{border-radius:28px}
.ac .t{font-weight:600;font-size:19px}
.motd{background:var(--card)!important;position:relative;overflow:hidden}
.motd:after{content:"";position:absolute;right:-26px;top:-26px;width:110px;height:110px;border-radius:50%;border:10px solid color-mix(in srgb,var(--acc) 18%,transparent);border-right-color:transparent;transform:rotate(30deg)}
.motd .mk{color:var(--acc)}
.motd .q{font-weight:500;font-style:italic;font-size:18px}
.ritual.morning{background:linear-gradient(135deg,color-mix(in srgb,#f2b64c 20%,var(--card)),var(--card))}
.ritual.evening{background:linear-gradient(135deg,color-mix(in srgb,#4f6a8f 22%,var(--card)),var(--card))}
.ritual button.go{border-radius:999px}
.pri{border-radius:999px}
.sec{border-radius:999px}
.fab{width:auto;height:56px;padding:0 22px 0 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.fab b{font-size:26px;font-weight:500;line-height:1}
.ring{width:80px;height:80px}
.ring .mk{position:absolute;inset:8px;display:flex;align-items:center;justify-content:center}
.ring .em{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:15px}
.hold{background:var(--soft)}
.hold.on{background:var(--c,var(--acc))}
/* hero */
.hero{color:var(--ink);background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 26%,var(--bg)) 0,color-mix(in srgb,var(--c) 8%,var(--bg)) 45%,var(--bg) 75%);border-radius:0 0 36px 36px;padding-bottom:22px}
.hero:before{display:none}
.hero .bigring{width:250px;height:250px}
.hero .in{inset:32px}
.zn{font-size:56px;font-weight:850;letter-spacing:-.04em;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.zn small{font-size:24px;color:var(--muted);font-weight:700}
.zl{font-size:14px;color:var(--muted);margin-top:4px}
.hero h2{font-size:28px;font-weight:600;margin:14px 0 4px}
.hero .sub{color:var(--muted);opacity:1}
.hero .badge{background:var(--card);color:var(--c)}
.appbar.over .back,.appbar.over .act{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.speech{display:flex;gap:12px;align-items:flex-start}
.speech .av{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:color-mix(in srgb,var(--c) 15%,var(--card));display:flex;align-items:center;justify-content:center;overflow:hidden}
.speech .bubble{flex:1;background:var(--soft);border-radius:4px 20px 20px 20px;padding:12px 14px;font-size:15px;line-height:1.45}
.speech .who{font-size:12px;font-weight:800;color:var(--c);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.stage{display:flex;justify-content:space-between;margin-top:14px;gap:4px}

  else if(mood==='worry'){eyes=`<circle cx="86" cy="98" r="4.5" fill="${ink}"/><circle cx="114" cy="98" r="4.5" fill="${ink}"/><path d="M78 88 l12 3 M122 88 l-12 3" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`;
    mouth=`<path d="M93 115 q7 -4 14 0" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    extra=`<path d="M131 80 q5 9 0 13 q-5 -4 0 -13z" fill="#8cc8f0"/>`;}
  else if(mood==='sad'){eyes=`<path d="M78 99 q8 6 16 0 M106 99 q8 6 16 0" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    mouth=`<path d="M92 117 q8 -7 16 0" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    extra=`<path d="M82 106 q3 8 0 11 q-3 -3 0 -11z" fill="#8cc8f0"/>`;}
  else if(mood==='sleep'){eyes=`<path d="M78 99 h16 M106 99 h16" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>`;
    mouth=`<ellipse cx="100" cy="114" rx="4" ry="3" fill="${ink}"/>`;
    extra=`<g fill="${ink}" opacity=".55" font-family="Georgia,serif" font-weight="700"><text x="134" y="74" font-size="16">z</text><text x="146" y="58" font-size="12">z</text></g>`;}
  else {eyes=`<path d="M78 98 q8 7 16 0 M106 98 q8 7 16 0" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    mouth=`<path d="M93 112 q7 6 14 0" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;}
  // head ornament by stage
  let top='';
  if(stage===0)top=`<ellipse cx="100" cy="52" rx="7" ry="5" fill="#a0784e"/>`;
  if(stage===1)top=`<path d="M100 58 v-14" stroke="#6f9a52" stroke-width="4" stroke-linecap="round"/><path d="M100 46 q-14 -2 -16 -14 q13 0 16 14z" fill="#86b35f"/><path d="M100 48 q12 -4 14 -15 q-12 1 -14 15z" fill="#9cc56f"/>`;
  if(stage===2)top=`<path d="M100 58 v-12" stroke="#6f9a52" stroke-width="4" stroke-linecap="round"/><path d="M100 22 q-14 14 -9 26 q9 4 18 0 q5 -12 -9 -26z" fill="#f2a7b4"/><path d="M100 26 q-6 10 -3 21 h6 q3 -11 -3 -21z" fill="#fbd3da"/><path d="M89 50 q-10 -6 -12 -14 q10 1 14 10z M111 50 q10 -6 12 -14 q-10 1 -14 10z" fill="#86b35f"/>`;
  if(stage>=3)top=`<g transform="translate(100 44)"><path d="M0 -26 q-13 13 -8 26 h16 q5 -13 -8 -26z" fill="#f4a3b2"/><path d="M-6 2 q-24 -4 -28 -22 q18 -2 28 14z" fill="#f2b6c2"/><path d="M6 2 q24 -4 28 -22 q-18 -2 -28 14z" fill="#f2b6c2"/><path d="M-4 2 q-14 -14 -10 -28 q12 8 14 22z" fill="#f7c4ce"/><path d="M4 2 q14 -14 10 -28 q-12 8 -14 22z" fill="#f7c4ce"/><ellipse cx="0" cy="4" rx="20" ry="5" fill="#86b35f"/><circle cx="0" cy="-4" r="4" fill="#f6c94c"/></g>`;
  const halo=stage>=4?`<circle cx="100" cy="98" r="78" fill="url(#halo${uid})"/>`:'';
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs><radialGradient id="halo${uid}"><stop offset=".55" stop-color="#f6c94c" stop-opacity=".55"/><stop offset="1" stop-color="#f6c94c" stop-opacity="0"/></radialGradient></defs>
  ${halo}
  <ellipse cx="100" cy="182" rx="60" ry="9" fill="#000" opacity=".08"/>
  <path d="M40 176 q-4 -20 14 -26 q-6 -18 18 -18 q10 -10 28 -10 q18 0 28 10 q24 0 18 18 q18 6 14 26z" fill="${robe}" opacity=".35"/>
  <path d="M48 176 q-2 -48 52 -62 q54 14 52 62z" fill="${robe}"/>
  <path d="M100 114 q-20 26 -14 62 h-10 q-6 -38 24 -62z" fill="#000" opacity=".12"/>
  <path d="M100 116 q30 10 40 34" stroke="#fff" stroke-opacity=".25" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="100" cy="160" rx="22" ry="11" fill="${skin}"/><path d="M84 158 q16 8 32 0" stroke="#e2bd98" stroke-width="2.5" fill="none"/>
  <circle cx="100" cy="96" r="40" fill="${skin}"/>
  <ellipse cx="60" cy="98" rx="6" ry="9" fill="${skin}"/><ellipse cx="140" cy="98" rx="6" ry="9" fill="${skin}"/>
  <circle cx="80" cy="108" r="6" fill="${cheek}" opacity=".45"/><circle cx="120" cy="108" r="6" fill="${cheek}" opacity=".45"/>
  ${eyes}${mouth}${top}${extra}
  ${prop==='env'?'<g transform="rotate(-6 100 158)"><rect x="76" y="142" width="48" height="32" rx="4" fill="#f8ead2" stroke="#3a2f28" stroke-width="3"/><path d="M77 144 l23 17 l23 -17" fill="none" stroke="#3a2f28" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="161" r="7.5" fill="#c4553f" stroke="#3a2f28" stroke-width="2.5"/><path d="M97 159 q3 4 6 0" stroke="#f3a9b8" stroke-width="2" fill="none"/></g>':''}
  ${prop==='gift'?'<g><rect x="78" y="146" width="44" height="28" rx="4" fill="#e8903a" stroke="#3a2f28" stroke-width="3"/><rect x="74" y="140" width="52" height="10" rx="3" fill="#f0c04f" stroke="#3a2f28" stroke-width="3"/><path d="M100 140v34" stroke="#c4553f" stroke-width="6"/><path d="M100 140c-6-10-18-8-14 0zM100 140c6-10 18-8 14 0z" fill="#c4553f" stroke="#3a2f28" stroke-width="2.5"/></g>':''}
  ${prop==='heart'?'<path d="M100 178c-14-10-20-17-20-25a9 9 0 0 1 20-3 9 9 0 0 1 20 3c0 8-6 15-20 25z" fill="#c4553f" stroke="#3a2f28" stroke-width="3"/>':''}
  </svg>`;
}

const MS_T=[3,7,14,21,30,40,60,90], MS_F=[3,7,14,30,60,90,100,180,365];
// ===== tips per template (4 stages: days 1–3, 4–7, 8–21, 22+) =====
const TIPS={
alc:{uk:['Перші дні тягне за звичкою — у ті самі години й місця. Підготуй заміну: газовану воду з лаймом, чай, безалкогольне пиво. Якщо ти пив щодня і багато, порадься з лікарем: різка відмова може бути небезпечною.','Скажи друзям про аскезу заздалегідь — так легше відмовлятися. Проста фраза «я зараз не п’ю, у мене челендж» працює краще за виправдання.','Багато хто помічає, що сон стає глибшим, а ранки бадьорішими. Запиши у вечірній підсумок, що змінилося в тебе.','Найнебезпечніша думка зараз — «я вже довів, можна один келих». Згадай, навіщо ти почав, і дійди до фінішу.'],
 ru:['Первые дни тянет по привычке — в те же часы и места. Подготовь замену: газированную воду с лаймом, чай, безалкогольное пиво. Если ты пил каждый день и много, посоветуйся с врачом: резкий отказ может быть опасен.','Скажи друзьям об аскезе заранее — так легче отказываться. Простая фраза «я сейчас не пью, у меня челлендж» работает лучше оправданий.','Многие замечают, что сон становится глубже, а утро бодрее. Запиши в вечерний итог, что изменилось у тебя.','Самая опасная мысль сейчас — «я уже доказал, можно один бокал». Вспомни, зачем ты начал, и дойди до финиша.'],
 en:['In the first days the urge comes from habit — same hours, same places. Prepare a swap: sparkling water with lime, tea, alcohol-free beer. If you drank heavily every day, talk to a doctor first: stopping abruptly can be dangerous.','Tell friends about your challenge in advance — it makes saying no easier. A simple “I’m not drinking right now, it’s a challenge” beats excuses.','Many people notice deeper sleep and brighter mornings. Write down in your evening review what has changed for you.','The riskiest thought now is “I’ve proven it, one glass is fine.” Remember why you started and reach the finish.']},
sweet:{uk:['Тяга до солодкого найсильніша в перші дні. Тримай під рукою горіхи, фрукти, сир — і не ходи в магазин голодним.','Читай склад: цукор ховається в соусах, йогуртах, гранолі, «корисних» батончиках.','Смак перебудовується: фрукти здаються солодшими, а десерти — надто приторними. Це знак, що звичка змінюється.','Свята й гості — головна пастка. Вирішуй заздалегідь, що відповіси, коли запропонують торт.'],
 ru:['Тяга к сладкому сильнее всего в первые дни. Держи под рукой орехи, фрукты, сыр — и не ходи в магазин голодным.','Читай состав: сахар прячется в соусах, йогуртах, гранолe, «полезных» батончиках.','Вкус перестраивается: фрукты кажутся слаще, а десерты — слишком приторными. Это знак, что привычка меняется.','Праздники и гости — главная ловушка. Реши заранее, что ответишь, когда предложат торт.'],
 en:['Sugar cravings are strongest in the first days. Keep nuts, fruit or cheese at hand — and don’t shop hungry.','Read labels: sugar hides in sauces, yogurts, granola and “healthy” bars.','Your taste adjusts: fruit tastes sweeter and desserts feel too sweet. That’s the habit changing.','Parties and guests are the main trap. Decide in advance what you’ll say when someone offers cake.']},
sm:{uk:['Видали застосунки з головного екрана або вийди з акаунтів — кожен зайвий крок зменшує автоматичні заходи.','Помічай, коли рука сама тягнеться до телефону: нудьга, черга, перед сном. Підготуй заміну — книжку, подкаст, прогулянку.','Звільнений час — твій бонус. Помічай, на що ти його тепер витрачаєш.','Подумай, як повернешся після аскези: які соцмережі справді потрібні і скільки часу ти їм даси.'],
 ru:['Удали приложения с главного экрана или выйди из аккаунтов — каждый лишний шаг уменьшает автоматические заходы.','Замечай, когда рука сама тянется к телефону: скука, очередь, перед сном. Подготовь замену — книгу, подкаст, прогулку.','Освободившееся время — твой бонус. Замечай, на что ты его теперь тратишь.','Подумай, как вернёшься после аскезы: какие соцсети действительно нужны и сколько времени ты им дашь.'],
 en:['Remove the apps from your home screen or log out — every extra step cuts automatic scrolling.','Notice when your hand reaches for the phone on its own: boredom, queues, bedtime. Prepare a swap — a book, a podcast, a walk.','The time you got back is your bonus. Notice what you spend it on now.','Think about how you’ll return afterwards: which apps you truly need and how much time you’ll give them.']},
coffee:{uk:['У перші дні може боліти голова і хотітися спати — це звичайна реакція на відмову від кофеїну, зазвичай вона минає за кілька днів. Пий більше води.','Збережи ритуал без кофеїну: чашка трав’яного чаю чи цикорію в той самий час.','Енергія стає рівнішою — без різких підйомів і спадів. Спробуй лягати трохи раніше.','Якщо захочеш повернути каву після аскези — обмеж її до однієї чашки до обіду.'],
 ru:['В первые дни может болеть голова и хотеться спать — это обычная реакция на отказ от кофеина, обычно она проходит за несколько дней. Пей больше воды.','Сохрани ритуал без кофеина: чашка травяного чая или цикория в то же время.','Энергия становится ровнее — без резких подъёмов и спадов. Попробуй ложиться чуть раньше.','Если захочешь вернуть кофе после аскезы — ограничь его одной чашкой до обеда.'],
 en:['Headaches and sleepiness are common in the first days — a normal reaction to cutting caffeine that usually passes within a few days. Drink more water.','Keep the ritual without caffeine: a cup of herbal tea or chicory at the same time.','Your energy gets steadier — fewer spikes and crashes. Try going to bed a little earlier.','If you bring coffee back afterwards, keep it to one cup before lunch.']},
shop:{uk:['Видали збережені картки з магазинів і відпишись від розсилок зі знижками.','Захотілося щось купити — додай у список і почекай 30 днів. Більшість бажань минає самі.','Порахуй, скільки вже заощадив порівняно зі звичайним місяцем, і відклади цю суму.','Подумай, які покупки справді приносили радість, а які були способом зняти стрес.'],
 ru:['Удали сохранённые карты из магазинов и отпишись от рассылок со скидками.','Захотелось что-то купить — добавь в список и подожди 30 дней. Большинство желаний проходят сами.','Посчитай, сколько уже сэкономил по сравнению с обычным месяцем, и отложи эту сумму.','Подумай, какие покупки действительно приносили радость, а какие были способом снять стресс.'],
 en:['Remove saved cards from shops and unsubscribe from sale newsletters.','Want to buy something? Add it to a list and wait 30 days. Most wants fade on their own.','Count how much you’ve saved compared with a normal month, and put that money aside.','Think about which purchases truly made you happy and which were a way to relieve stress.']},
swear:{uk:['Помічай моменти, коли зриваєшся найчастіше: за кермом, у грі, на роботі. Усвідомлення — перший крок.','Придумай свої «безпечні» слова-заміни. Звучить смішно, але працює.','Попроси близьких м’яко нагадувати, коли зриваєшся, — без докорів.','Слова впливають на настрій: багато хто помічає, що стає спокійнішим. Як у тебе?'],
 ru:['Замечай моменты, когда срываешься чаще всего: за рулём, в игре, на работе. Осознание — первый шаг.','Придумай свои «безопасные» слова-замены. Звучит смешно, но работает.','Попроси близких мягко напоминать, когда срываешься, — без упрёков.','Слова влияют на настроение: многие замечают, что становятся спокойнее. Как у тебя?'],
 en:['Notice when you slip most: driving, gaming, at work. Awareness is the first step.','Come up with your own “safe” replacement words. It sounds silly, but it works.','Ask people close to you to gently remind you when you slip — no blaming.','Words shape mood: many people notice they get calmer. How about you?']},
early:{uk:['Ранній підйом починається ввечері: лягай на 30–60 хвилин раніше і прибери телефон з ліжка.','Постав будильник подалі від ліжка і відкривай штори одразу після підйому — світло допомагає прокинутися.','Придумай приємний ранковий ритуал — каву, прогулянку, музику, — щоб було заради чого вставати.','Тримай режим і у вихідні: стрибки на 2–3 години збивають ритм.'],
 ru:['Ранний подъём начинается вечером: ложись на 30–60 минут раньше и убери телефон из кровати.','Поставь будильник подальше от кровати и открывай шторы сразу после подъёма — свет помогает проснуться.','Придумай приятный утренний ритуал — кофе, прогулку, музыку, — чтобы было ради чего вставать.','Держи режим и в выходные: скачки на 2–3 часа сбивают ритм.'],
 en:['Waking early starts the night before: go to bed 30–60 minutes earlier and keep your phone out of bed.','Put the alarm away from the bed and open the curtains right after waking — light helps you wake up.','Create a pleasant morning ritual — coffee, a walk, music — so there’s something to get up for.','Keep the schedule on weekends too: 2–3 hour shifts throw off your rhythm.']},
sport:{uk:['Почни з малого: 15–20 хвилин щодня легше, ніж година раз на тиждень. Головне — регулярність.','Приготуй форму з вечора і тренуйся в той самий час — так не доведеться щоразу вирішувати.','Біль у м’язах після нових навантажень — нормально, але гострий біль — сигнал зупинитися і відпочити.','Чергуй навантаження: сила, кардіо, розтяжка. Легкий день — теж тренування.'],
 ru:['Начни с малого: 15–20 минут каждый день легче, чем час раз в неделю. Главное — регулярность.','Приготовь форму с вечера и тренируйся в одно и то же время — так не придётся каждый раз решать.','Мышечная боль после новых нагрузок — нормально, но острая боль — сигнал остановиться и отдохнуть.','Чередуй нагрузки: сила, кардио, растяжка. Лёгкий день — тоже тренировка.'],
 en:['Start small: 15–20 minutes a day is easier than an hour once a week. Consistency matters most.','Lay out your gear the night before and train at the same time — fewer decisions to make.','Muscle soreness after new training is normal, but sharp pain is a signal to stop and rest.','Mix it up: strength, cardio, stretching. An easy day is still a training day.']},
smoke:{uk:['Перші дні найважчі: тяга приходить хвилями по кілька хвилин. Пий воду, жуй жуйку, виходь пройтися. Нікотинозамісна терапія може допомогти — порадься з лікарем.','Уникай тригерів: кава в тому ж місці, перерви з курцями. Зміни маршрут і ритуали хоча б на якийсь час.','Смак і запахи стають яскравішими, легше дихати. Записуй зміни — це нагадування, навіщо ти тримаєшся.','Головна пастка — «одна не зашкодить». Зазвичай саме з однієї й починається повернення.'],
 ru:['Первые дни самые трудные: тяга приходит волнами по несколько минут. Пей воду, жуй жвачку, выходи пройтись. Никотинозаместительная терапия может помочь — посоветуйся с врачом.','Избегай триггеров: кофе в том же месте, перекуры с курящими. Поменяй маршрут и ритуалы хотя бы на время.','Вкус и запахи становятся ярче, легче дышать. Записывай изменения — это напоминание, зачем ты держишься.','Главная ловушка — «одна не повредит». Обычно именно с одной и начинается возвращение.'],
 en:['The first days are the hardest: cravings come in waves of a few minutes. Drink water, chew gum, go for a walk. Nicotine replacement can help — ask a doctor.','Avoid triggers: coffee in the same spot, smoke breaks with smokers. Change routes and rituals, at least for a while.','Taste and smell get sharper, breathing gets easier. Write the changes down — they remind you why you’re holding on.','The main trap is “just one won’t hurt.” Going back usually starts with exactly one.']},
fast:{uk:['Готуй їжу наперед і бери з собою — фастфуд виграє, коли ти голодний і поспішаєш.','Видали застосунки доставки або вимкни сповіщення про акції.','Знайди 2–3 швидкі домашні страви на 15 хвилин — твоя заміна фастфуду.','Порахуй заощаджені гроші — і подумай, на що їх витратити.'],
 ru:['Готовь еду заранее и бери с собой — фастфуд выигрывает, когда ты голоден и спешишь.','Удали приложения доставки или выключи уведомления об акциях.','Найди 2–3 быстрых домашних блюда на 15 минут — твоя замена фастфуду.','Посчитай сэкономленные деньги — и подумай, на что их потратить.'],
 en:['Prep food ahead and take it with you — fast food wins when you’re hungry and rushed.','Delete delivery apps or turn off promo notifications.','Find 2–3 quick 15-minute home meals — your fast-food replacement.','Count the money you saved — and decide what to spend it on.']},
read:{uk:['Почни з 10 сторінок або 15 хвилин на день — краще мало, але щодня.','Тримай книжку там, де зазвичай гортаєш телефон: біля ліжка, в сумці.','Якщо книжка не йде — сміливо змінюй її. Аскеза про звичку читати, а не про конкретну книжку.','Записуй кілька думок із прочитаного у вечірній підсумок — так краще запам’ятовується.'],
 ru:['Начни с 10 страниц или 15 минут в день — лучше мало, но каждый день.','Держи книгу там, где обычно листаешь телефон: у кровати, в сумке.','Если книга не идёт — смело меняй её. Аскеза про привычку читать, а не про конкретную книгу.','Записывай пару мыслей из прочитанного в вечерний итог — так лучше запоминается.'],
 en:['Start with 10 pages or 15 minutes a day — a little, but every day.','Keep the book where you usually scroll your phone: by the bed, in your bag.','If a book isn’t working, switch it. The challenge is about the reading habit, not a specific book.','Jot a couple of thoughts from your reading in the evening review — it helps you remember.']},
food:{uk:['Перші дні найважчі: тримай під рукою корисну заміну і не ходи в магазин голодним.','Читай склад продуктів — заборонене часто ховається там, де не чекаєш.','Смаки й звички перебудовуються — відзначай, що вже дається легше.','Вирішуй заздалегідь, що відповіси на «та трохи можна» в гостях.'],
 ru:['Первые дни самые трудные: держи под рукой полезную замену и не ходи в магазин голодным.','Читай состав продуктов — запретное часто прячется там, где не ждёшь.','Вкусы и привычки перестраиваются — отмечай, что уже даётся легче.','Реши заранее, что ответишь на «да немного можно» в гостях.'],
 en:['The first days are the hardest: keep a healthy swap at hand and don’t shop hungry.','Read labels — what you’re avoiding often hides where you don’t expect it.','Tastes and habits adjust — notice what already feels easier.','Decide in advance what you’ll say to “just a little is fine” at parties.']},
digital:{uk:['Прибери спокусу з очей: видали застосунок або сховай його в папку на останньому екрані.','Помічай тригери — нудьгу, втому, черги — і готуй заміну заздалегідь.','Помічай, скільки часу звільнилося, і вирішуй, куди його вкласти.','Подумай, як користуватимешся цим після аскези — свідомо, а не автоматично.'],
 ru:['Убери соблазн с глаз: удали приложение или спрячь его в папку на последнем экране.','Замечай триггеры — скуку, усталость, очереди — и готовь замену заранее.','Замечай, сколько времени освободилось, и решай, куда его вложить.','Подумай, как будешь пользоваться этим после аскезы — осознанно, а не автоматически.'],
 en:['Get the temptation out of sight: delete the app or hide it in a folder on the last screen.','Notice triggers — boredom, tiredness, queues — and prepare a swap in advance.','Notice how much time you’ve freed up and decide where to invest it.','Think about how you’ll use it after the challenge — mindfully, not automatically.']},
habit:{uk:['Прив’яжи нову звичку до того, що вже робиш щодня: після кави, після душу.','Зменш поріг: якщо немає сил — зроби хоча б мінімальну версію. Це теж рахується.','Не пропускай двічі поспіль: один пропуск — випадковість, два — початок старої звички.','Відзнач, що змінилося, і подумай, чи хочеш залишити цю звичку назавжди.'],
 ru:['Привяжи новую привычку к тому, что уже делаешь каждый день: после кофе, после душа.','Снизь порог: если нет сил — сделай хотя бы минимальную версию. Это тоже считается.','Не пропускай два раза подряд: один пропуск — случайность, два — начало старой привычки.','Отметь, что изменилось, и подумай, хочешь ли оставить эту привычку навсегда.'],
 en:['Attach the new habit to something you already do daily: after coffee, after a shower.','Lower the bar: if you’re out of energy, do at least a tiny version. It still counts.','Never skip twice in a row: one miss is an accident, two is the old habit returning.','Notice what has changed and decide whether you want to keep this habit for good.']},
generic:{uk:['Перші дні найважчі. Просто проживи сьогодні — про завтра подумаєш завтра.','Помічай, що штовхає тебе зірватися, і май план на ці моменти.','Відзначай зміни у вечірньому підсумку — так видно, що зусилля не марні.','Фініш близько: згадай, навіщо почав, і дотисни.'],
 ru:['Первые дни самые трудные. Просто проживи сегодня — о завтра подумаешь завтра.','Замечай, что подталкивает тебя сорваться, и имей план на эти моменты.','Отмечай изменения в вечернем итоге — так видно, что усилия не напрасны.','Финиш близко: вспомни, зачем начал, и дожми.'],
 en:['The first days are the hardest. Just get through today — think about tomorrow tomorrow.','Notice what pushes you to slip and have a plan for those moments.','Note the changes in your evening review — it shows your effort isn’t wasted.','The finish is close: remember why you started and push through.']}

function hsh(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return ((h>>>0)%10000)/10000;}
const ANCHOR='2026-11-05';
function personItems(id){const t=today();return PEOPLE[id].items.map(([k,days,cur],i)=>{const e=ALL_TPL[k];const start=addDays(ANCHOR,-(cur-1));const d=diff(start,t)+1;
  const forever=days===0;const dd=forever?d:Math.min(d,days);let ok=0;for(let j=0;j<dd-1;j++)if(hsh(id+k+j)<.88)ok++;
  const todayOk=hsh(id+k+t)<Math.min(1,new Date().getHours()/18+.15);if(todayOk)ok++;
  return {k,icon:e[1],title:tplName(e),days,forever,d:dd,ok,todayOk,color:PEOPLE[id].c,done:!forever&&d>days};});}
function personMood(id){const its=personItems(id);return its.some(x=>!x.todayOk)?'calm':'joy';}

function partnerMarks(it){const p=it.partner;if(!p)return {};const m={},t=today();for(let k=it.start;k<t;k=addDays(k,1))m[k]=hsh(p+it.id+k)<.9?'ok':'fail';
  if(hsh(p+it.id+t)<Math.min(1,new Date().getHours()/18+.15))m[t]='ok';return m;}
function jointStreak(it){const a=it.marks||{},b=partnerMarks(it),t=today();let k=(a[t]==='ok'&&b[t]==='ok')?t:addDays(t,-1),n=0;while(k>=it.start&&a[k]==='ok'&&b[k]==='ok'){n++;k=addDays(k,-1);}return n;}

function setMark(it,k,v){it.marks=it.marks||{};if(v)it.marks[k]=v;else delete it.marks[k];

function markOk(it){const big=setMark(it,today(),'ok');if(!big){const c=T('cheers');toast(c[Math.floor(Math.random()*c.length)],[T('undo'),()=>setMark(it,today(),null)]);}}
function relapse(it){const t=today();it.relapses=it.relapses||[];if(!it.relapses.includes(t))it.relapses.push(t);
  it.best=Math.max(it.best||0,fDays(it));it.start=t;it.ms=[];save();render();toast(T('relapsed'));}
function askFail(it,k){
  const txt=isF(it)?T('failForever'):(it.strict?T('failStrict'):T('failSoft'));
  sheet(`<h3>${T('failT')}</h3><p>${txt}</p><div class="col"><button class="pri" style="background:var(--bad);color:#fff" id="fy">${T('failYes')}</button><button class="sec" id="fn">${T('cancel')}</button></div>`,
  root=>{root.querySelector('#fy').onclick=()=>{closeLayer();
      if(isF(it))relapse(it);
      else if(it.strict){it.restarts=(it.restarts||0)+1;it.start=addDays(today(),1);it.marks={};it.ms=[];save();render();toast(T('failedStrict'));}
      else setMark(it,k,'fail');};
    root.querySelector('#fn').onclick=closeLayer;});
}

function heatmap(it){
  const t=today(),m=it.marks||{},rel=it.relapses||[];
  const from=isF(it)?(it.created||it.start):it.start;
  const to=isF(it)?t:(it.doneAt?addDays(endKey(it),0):endKey(it));
  const total=diff(from,to)+1;
  const s=total>120?13:total>60?18:total>35?24:30;
  const startDow=(parse(from).getDay()+6)%7; // Mon=0
  let cells='';for(let i=0;i<startDow;i++)cells+='<div class="x"></div>';
  for(let i=0;i<total;i++){const k=addDays(from,i);let cls='';
    if(isF(it)){cls=k>t?'':(rel.includes(k)?'fail':(k<t?'ok':''));}
    else{const v=m[k];cls=v==='ok'?'ok':v==='fail'?'fail':(k<t?'miss':'');if(k<=t&&!it.doneAt)cls+=' past';}
    if(k===t)cls+=' today';
    cells+=`<div class="${cls}" data-day="${k}" data-i="${i+1}" title="${fmtShort(k)}"></div>`;}
  return `<div class="hm-row" style="--s:${s}px"><div class="hm-days">${T('wd').map(d=>`<span>${d}</span>`).join('')}</div><div class="hm-wrap"><div class="hm">${cells}</div></div></div>`;
}

  // action
  if(!it.doneAt&&!notStarted){
    if(F)h+=`<div class="card"><button class="failbtn" id="dFail" style="margin:0">${T('failToday')}</button></div>`;
    else{const tm=m[t],pl=pledged(it,t),cc=canConfirm(it);let inner;
      if(tm)inner=`<button class="holdbar done" id="dUndo"><span>${tm==='ok'?T('marked'):'✗ '+T('setFail')}</span></button><div class="hint">${T('tapUndo')}</div>${tm==='ok'?`<button class="failbtn" id="dFail">${T('failToday')}</button>`:''}`;
      else if(!cc&&pl)inner=`<div class="holdbar pledged"><span>${stk('lotus',22)} ${T('pledgedBar')}</span></div><div class="hint">${T('confirmAt')} ${cutHour()}:00</div><button class="failbtn" id="dFail">${T('failToday')}</button>`;
      else inner=`<div class="holdbar" id="dHold"><div class="fill"></div><span>${isDo(it)?T('hDo'):T('holdToday')}</span></div><button class="failbtn" id="dFail">${T('failToday')}</button>`;
      h+=`<div class="card">${inner}</div>`;}}
  // phase + milestones
  if(!it.doneAt&&!notStarted){const ph=phase(it),cnt=progressCount(it);
    h+=`<div class="card"><div class="lbl">${T('phaseL')}</div><div class="phase"><div class="pi">${stk(phIcon(it),36)}</div><div><b>${ph[1]}</b><span>${ph[2]}</span></div></div>
    <div class="ms">${milestonesFor(it).map(x=>`<span class="${cnt>=x.n?'got':''}">${cnt>=x.n?'✓ ':''}${T('ms')[x.k]}</span>`).join('')}${F?'':`<span>${stk('flag',14)} ${it.days}</span>`}</div></div>`;}
  if(!it.doneAt&&!notStarted){const tp=tipFor(it);h+=`<div class="card"><div class="lbl">${stk('bulb',18)} ${T('tipL')} · ${T('dayT')(tp.d)}</div><div style="font-size:15.5px;line-height:1.5">${tp.text}</div></div>`;}
  if(it.why)h+=`<div class="card"><div class="lbl">${T('why')}</div><div class="why">«${esc(it.why)}»</div></div>`;
  // heatmap
  h+=`<div class="card"><div class="lbl">${T('map')}</div>${heatmap(it)}
   <div class="legend"><span><i style="background:${c}"></i>${T('lgOk')}</span><span><i style="background:var(--bad)"></i>${T('lgFail')}</span>${F?'':`<span><i style="box-shadow:inset 0 0 0 1.5px var(--muted)"></i>${T('lgMiss')}</span>`}<span><i style="box-shadow:inset 0 0 0 2px var(--ink)"></i>${T('lgToday')}</span></div>
   ${!F&&!it.doneAt?`<div class="note">${T('tapPast')}</div>`:''}</div>`;
  // diary
  const from=F?(it.created||it.start):it.start,to=F?t:(it.doneAt||t);
  const notes=Object.keys(S.days).filter(k=>k>=from&&k<=to&&S.days[k].review).sort().reverse().slice(0,10);
  if(notes.length)h+=`<div class="card diary"><div class="lbl">${T('diary')}</div>${notes.map(k=>{const d=S.days[k];return `<div class="de"><div class="dm">${stk('m'+(d.mood??1),30)}</div><div><div class="dd">${fmtShort(k)}</div><div class="dn">${esc(d.note||T('moods')[d.mood??1][1])}</div></div></div>`;}).join('')}</div>`;
  h+=`<button class="sharebtn" id="dStory">${stk('camera',22)} ${T('story')}</button><button class="danger" id="dDel">${T('del')}</button></div>`;
  main.innerHTML=h;const $=s=>main.querySelector(s);
  main.querySelectorAll('[data-came]').forEach(b=>b.onclick=()=>{it.goal.came=b.dataset.came==='1';save();render();});
  if($('#dCheer'))$('#dCheer').onclick=()=>toast(X('cheered',PNa(it.partner)));
  if($('#dHold'))bindHold($('#dHold'),()=>holdAct(it),()=>holdTap(it));
  if($('#dUndo'))$('#dUndo').onclick=()=>setMark(it,t,null);
  if($('#dFail'))$('#dFail').onclick=()=>askFail(it,t);
  $('#dStory').onclick=()=>storyCard(it);
  if(!F)main.querySelectorAll('.hm .past').forEach(el=>el.onclick=()=>{const k=el.dataset.day;
    sheet(`<h3>${T('dayT')(el.dataset.i)} · ${fmtDate(k)}</h3><div class="col" style="margin-top:12px">
      <button class="pri" style="background:${c};color:#fff" data-s="ok">${T('setOk')}</button>
      <button class="sec" style="color:var(--bad)" data-s="fail">${T('setFail')}</button>
      ${m[k]?`<button class="sec" data-s="">${T('setNone')}</button>`:''}</div>`,
    root=>root.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{closeLayer();const v=b.dataset.s;if(v==='fail'&&it.strict)askFail(it,k);else setMark(it,k,v||null);}));});
  $('#dDel').onclick=()=>sheet(`<h3>${T('delQ')}</h3><p>${T('delP')}</p><div class="col"><button class="pri" style="background:var(--bad);color:#fff" id="dy">${T('delYes')}</button><button class="sec" id="dn">${T('cancel')}</button></div>`,
    root=>{root.querySelector('#dy').onclick=()=>{S.items=S.items.filter(x=>x.id!==it.id);save();closeLayer();go(route.from||'home');};root.querySelector('#dn').onclick=closeLayer;});
}

// =====================================================================
// DONE / SETTINGS
// =====================================================================
function vDone(){
  setBar(T('tabDone'));const list=finished();
  if(!list.length){main.innerHTML=`<div class="view empty"><div class="e">${stk('trophy',84)}</div><p>${T('doneNone')}</p></div>`;return;}
  let h='<div class="view">';
  list.forEach(it=>{const f=info(it),c=it.color||COLORS[0];
    h+=`<div class="card" style="--c:${c};padding:0"><div class="ac" data-open="${it.id}"><div class="ring">${ringSVG(80,7,f.ok/it.days,c)}<div class="mk">${monkSVG(4,'joy',c,64,'d'+it.id)}</div><div class="em">${stk(it.icon,30)}</div></div>
    <div class="bd"><div class="t">${esc(it.title)}</div><div class="s">${T('result')(f.ok,it.days)} · ${T('doneOn')(fmtDate(it.doneAt))}</div></div>${stk('trophy',34)}</div></div>`;});
  const wishes=S.items.filter(it=>it.goal&&it.goal.type==='wish'&&it.goal.opened);
  if(wishes.length){h+=`<div class="sec-t">${stk('chest',22)} ${T('chestT')}</div>`+wishes.map(it=>{const g=it.goal;return `<div class="card goalc"><div class="gc-ic">${stk('envopen',44)}</div><div class="gc-b"><div class="gt serif">«${esc(g.text)}»</div><div class="note" style="margin-top:2px">${stk(it.icon,16)} ${esc(it.title)}</div>
    ${g.came==null?`<div class="came"><span>${T('came')}</span><button data-came="1" data-id="${it.id}">${T('yesC')}</button><button data-came="0" data-id="${it.id}">${T('noC')}</button></div>`:`<div class="cameb ${g.came?'y':''}">${g.came?T('came1'):T('came0')}</div>`}</div></div>`;}).join('');}
  main.innerHTML=h+'</div>';
  main.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>go('detail',{id:el.dataset.open,from:'done'}));
  main.querySelectorAll('[data-came]').forEach(b=>b.onclick=()=>{const it=byId(b.dataset.id);it.goal.came=b.dataset.came==='1';save();render();});
}
function vSettings(){
  setBar(T('tabSettings'));
  main.innerHTML=`<div class="view"><div class="card"><b>${T('langT')}</b><div class="seg3"><button data-l="uk" class="${L==='uk'?'on':''}">Українська</button><button data-l="ru" class="${L==='ru'?'on':''}">Русский</button><button data-l="en" class="${L==='en'?'on':''}">English</button></div></div>
  <div class="card"><b>${T('themeT')}</b><div class="seg3"><button data-th="auto" class="${TH==='auto'?'on':''}">${T('thAuto')}</button><button data-th="light" class="${TH==='light'?'on':''}">${T('thLight')}</button><button data-th="dark" class="${TH==='dark'?'on':''}">${T('thDark')}</button></div></div>
  ${DEMO?`<div class="card"><b>${X('accT')}</b>${S.account?`<div style="display:flex;gap:12px;align-items:center;margin-top:12px">${myAvatar(48)}<div style="flex:1"><b>${esc(S.account.name)}</b><div class="muted">@${esc(S.account.handle)}</div></div><button class="sbtn" id="sOut">${X('logout')}</button></div>`:`<button class="pri" id="sAcc" style="margin-top:12px">${X('createAcc')}</button>`}<div class="note">🧪 ${X('demo')}</div></div>`:''}
  <div class="card"><b>${stk('moon',22)} ${T('cutL')}</b><div class="cutrow"><button id="cMinus">−</button><span id="cVal">${cutHour()}:00</span><button id="cPlus">+</button></div><div class="note">${T('cutD')}</div></div>
  <div class="card"><b>${T('aboutT')}</b><div class="note" style="font-size:14px">${T('about')}</div></div>
  <button class="danger" id="sReset">${T('resetAll')}</button></div>`;
  main.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{TH=b.dataset.th;try{localStorage.setItem('askeza.theme',TH);}catch(e){}applyTheme();render();});
  main.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{L=b.dataset.l;S.lang=L;try{localStorage.setItem('askeza.lang',L);}catch(e){}save();render();});
  if(main.querySelector('#sAcc'))main.querySelector('#sAcc').onclick=()=>go('account',{from:'settings'});
  if(main.querySelector('#sOut'))main.querySelector('#sOut').onclick=()=>{S.account=null;S.friends=[];S.requests=[];save();render();};
  main.querySelector('#cMinus').onclick=()=>{S.cut=Math.max(12,cutHour()-1);save();render();};
  main.querySelector('#cPlus').onclick=()=>{S.cut=Math.min(23,cutHour()+1);save();render();};
  let arm=0;main.querySelector('#sReset').onclick=()=>{const n=Date.now();if(n-arm>4000){arm=n;toast(T('resetQ'));return;}S={items:[],days:{},lang:L};save();go('home');};
}

// =====================================================================
// layers: sheet, toast, modals, story
// =====================================================================
const layer=document.getElementById('layer');
function closeLayer(){layer.innerHTML='';if(pendingMs){const [it,m]=pendingMs;pendingMs=null;milestone(it,m);}}
function sheet(html,bind){layer.innerHTML=`<div class="ov"><div class="sheet">${html}</div></div>`;const ov=layer.firstChild;ov.onclick=e=>{if(e.target===ov)closeLayer();};bind&&bind(ov);}
let tT=null;
function toast(msg,action){const old=document.querySelector('.toast');if(old)old.remove();clearTimeout(tT);
  const el=document.createElement('div');el.className='toast';el.innerHTML=`<span>${msg}</span>`;
  if(action){const b=document.createElement('button');b.textContent=action[0];b.onclick=()=>{el.remove();action[1]();};el.appendChild(b);}
  document.body.appendChild(el);tT=setTimeout(()=>el.remove(),3500);}
function confetti(n){const cf=document.getElementById('conf'),cols=['#1f9d8b','#6b5bd6','#e0773a','#f2c94c','#d9467a','#2f7fd6'];
  for(let i=0;i<n;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%cols.length];p.style.animationDuration=(2+Math.random()*2.2)+'s';p.style.animationDelay=(Math.random()*.6)+'s';cf.appendChild(p);}}
function modal(icon,kick,title,desc,btn,onBtn,conf,extra){
  layer.innerHTML=`<div class="ov center"><div class="mbox"><div class="mi">${icon}</div><div class="mk">${kick}</div><div class="mt">${title}</div><div class="md">${desc}</div><button class="pri" id="mOk" style="background:var(--acc);color:#fff">${btn}</button>${extra?`<button class="sec" id="mEx" style="width:100%;margin-top:8px">${extra[0]}</button>`:''}</div></div><div class="conf" id="conf"></div>`;
  confetti(conf);try{navigator.vibrate&&navigator.vibrate([40,60,40]);}catch(e){}
  document.getElementById('mOk').onclick=()=>{layer.innerHTML='';onBtn&&onBtn();};
  if(extra)document.getElementById('mEx').onclick=()=>{layer.innerHTML='';extra[1]();};}
function milestone(it,x){modal(stk('sparkle',84),T('msK'),T('msT')[x.k],`${it.icon} ${esc(it.title)}<br>${T('msD')}`,T('msBtn'),null,40,[T('story'),()=>storyCard(it)]);}
function celebrate(it){const f=info(it),g=it.goal;
  const after=()=>{if(g&&g.type==='wish'&&!g.opened)openWish(it,()=>go('done'));else if(g&&g.type==='reward')modal(stk('gift',96),T('rDoneK'),esc(g.text),T('rDoneD'),T('close'),()=>go('done'),60);else go('done');};
  const desc=T('doneD')(it.days,f.ok)+(g&&g.type==='dedic'?`<br><br><b>${T('dDoneK')}:</b> ${esc(g.text)}`:'');
  modal(stk(it.icon,84),T('doneK'),esc(it.title),desc,g&&g.type!=='dedic'?T('msBtn'):T('close'),after,90,[T('story'),()=>storyCard(it)]);}

// story card (1080x1920 canvas) — zen style with the monk
function storyCard(it){
  const f=info(it),c=it.color||COLORS[0],F=isF(it);
  const W=1080,H=1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
  const BG=dark?'#0b0b0b':'#f3ede2',INK=dark?'#f4efe6':'#2b2622',MUT=dark?'#9b948a':'#8a7f73';
  x.fillStyle=BG;x.fillRect(0,0,W,H);
  const rg=x.createRadialGradient(W/2,760,40,W/2,760,900);rg.addColorStop(0,c+'55');rg.addColorStop(.5,c+'18');rg.addColorStop(1,BG);x.fillStyle=rg;x.fillRect(0,0,W,H);
  const SERIF='Lora,Georgia,serif',SANS='-apple-system,system-ui,"Segoe UI",Roboto,sans-serif';
  const cx=W/2,cy=760,R=360;let pct;
  if(F){const nx=nextMs(it),pv=prevMs(it);pct=(f.cur-pv)/(nx-pv||1);}else pct=it.doneAt?f.ok/it.days:Math.min(1,Math.max(0,(it.strict?f.st:f.ok)/it.days));
  x.lineCap='round';x.lineWidth=18;x.strokeStyle=dark?'#22201e':'#e6dccb';x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.stroke();
  const a0=-Math.PI*0.56,a1=a0+Math.PI*2*Math.max(.02,pct);
  x.lineWidth=40;x.strokeStyle=c;x.beginPath();x.arc(cx,cy,R,a0,a1);x.stroke();
  x.lineWidth=12;x.globalAlpha=.45;x.beginPath();x.arc(cx,cy,R-22,a0,a0+(a1-a0)*.93);x.stroke();x.globalAlpha=1;
  x.textAlign='center';
  let big,small;
  if(F){big=String(f.cur);small=`${T('daysW')(f.cur)} ${T('stClean')}`;}
  else if(it.doneAt){big=`${f.ok}/${it.days}`;small=T('stDone');}
  else{const d=Math.max(1,Math.min(f.d,it.days));big=`${d}/${it.days}`;small=T('stDay');}
  x.fillStyle=INK;x.font=`800 190px ${SANS}`;x.fillText(big,cx,1330);
  x.fillStyle=MUT;x.font=`600 52px ${SANS}`;x.fillText(small,cx,1405);
  x.fillStyle=INK;x.font=`600 92px ${SERIF}`;const tt=it.title.length>22?it.title.slice(0,21)+'…':it.title;x.fillText(tt,cx+60,1560);const tw=x.measureText(tt).width;
  x.fillStyle=MUT;x.font=`italic 500 46px ${SERIF}`;x.fillText(`${T('charL')} · ${T('stages')[stageOf(it)]}`,cx,1640);
  if(F&&it.perDay){x.fillStyle=c;x.font=`700 50px ${SANS}`;x.fillText(money(it.perDay*f.cur),cx,1720);}
  x.fillStyle=INK;x.globalAlpha=.75;x.font=`700 40px ${SANS}`;x.fillText('◯  '+T('appName').toUpperCase(),cx,H-90);x.globalAlpha=1;
  const svg=monkSVG(stageOf(it),it.doneAt||isF(it)?'joy':moodOf(it),c,600,'st');
  const img=new Image();
  const finish=()=>{const url=cv.toDataURL('image/png');
  sheet(`<h3>${T('storyT')}</h3><img class="storyimg" src="${url}" alt=""><p style="margin-top:12px;text-align:center">${T('storyHint')}</p><div class="col"><button class="pri" id="stShare" style="background:${c};color:#fff">${T('share')}</button><a class="sec" id="stDl" href="${url}" download="askezik.png" style="text-align:center;text-decoration:none;color:var(--ink)">${T('download')}</a></div>`,
   root=>{root.querySelector('#stShare').onclick=async()=>{try{const blob=await (await fetch(url)).blob();const file=new File([blob],'askezik.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});}else{toast(T('storyHint'));}}catch(e){if(e&&e.name!=='AbortError')toast(T('storyHint'));}};});};
  const ic=new Image();ic.onload=()=>{x.drawImage(ic,cx+60-tw/2-130,1470,112,112);finish();};ic.onerror=finish;
  img.onload=()=>{x.drawImage(img,cx-280,cy-300,560,560);ic.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(stkStandalone(it.icon,224));};
  img.onerror=finish;
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

document.getElementById('stkdefs').innerHTML=STK_FILTER;
document.querySelectorAll('[data-ti]').forEach(e=>e.innerHTML=tabIcon(e.dataset.ti));
(function deEmoji(){const RX=/\s*(?:\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}])(?:\uFE0F|\u200D\p{Extended_Pictographic})*\s*/gu;
  const clean=v=>typeof v==='string'?v.replace(RX,' ').replace(/\s{2,}/g,' ').replace(/ ([.,!?…:)])/g,'$1').trim():v;
  const walk=o=>{for(const k in o){const v=o[k];if(typeof v==='string')o[k]=clean(v);else if(typeof v==='function'){o[k]=(...a)=>clean(v(...a));}else if(v&&typeof v==='object')walk(v);}};
  walk(I);walk(SX);})();
render();
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();render();}},30000);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!layer.innerHTML&&route.v!=='new')render();});
</script>
